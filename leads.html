<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads - CRAISA Leads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo-section">
                <img src="assets/logo-craisa.png" alt="CRAISA" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Sistema de Gestión de Leads</span>
                    <span class="logo-subtitle">Listado de Consultas</span>
                </div>
            </div>
            <nav class="nav" role="navigation" aria-label="Navegación principal">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="leads.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
                    <span>Leads</span>
                </a>
            </nav>
            <div class="user-menu">
                <div class="user-avatar">MR</div>
                <div class="user-info">
                    <span class="user-name">María Rojas</span>
                    <span class="user-role">Vendedora · Agrícola</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <div class="page-title-section">
                    <h1>Leads Comerciales</h1>
                    <p class="page-subtitle">184 registros</p>
                </div>
                <div class="page-actions">
                    <a href="nuevo-lead.html" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Nuevo Lead
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body" style="padding: 0;">
                    <div class="table-container">
                        <table class="table" id="leadsTable">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Cliente</th>
                                    <th>Empresa</th>
                                    <th>Canal</th>
                                    <th>Línea</th>
                                    <th>Estado</th>
                                    <th>Responsable</th>
                                </tr>
                            </thead>
                            <tbody id="leadsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
    const LEADS = [
        { code: 'LEAD-2026-0142', client: 'Ana Rodríguez', company: 'Finca La Sabana', canal: 'WhatsApp', linea: 'Agrícola', estado: 'nuevo', responsable: 'J. Pérez' },
        { code: 'LEAD-2026-0141', client: 'Luis Miranda', company: 'Constructora Hidalgo', canal: 'Sitio web', linea: 'Construcción', estado: 'seguimiento', responsable: 'M. Rojas' },
        { code: 'LEAD-2026-0140', client: 'Banacol S.A.', company: 'Banacol', canal: 'Feria', linea: 'Agrícola', estado: 'oportunidad', responsable: 'J. Pérez' }
    ];

    const tbody = document.getElementById('leadsBody');
    tbody.innerHTML = LEADS.map(l => '<tr><td>' + l.code + '</td><td>' + l.client + '</td><td>' + l.company + '</td><td>' + l.canal + '</td><td>' + l.linea + '</td><td>' + l.estado + '</td><td>' + l.responsable + '</td></tr>').join('');
    console.log('Rendered', LEADS.length, 'leads');
    </script>
    <script src="js/app.js"></script>
