<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#134F9C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/logo-craisa.png" />
    <title>CRAISA Leads</title>
    <!-- En linea y no en index.css: tiene que pintarse antes de que baje el CSS de la app.
         components/page-loader.tsx reusa estas clases para que el paso a React no salte. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #faf9f7;
        font-family: 'Inter Variable', ui-sans-serif, system-ui, sans-serif;
      }
      /* El PNG trae el sello Carbono Neutral a la derecha: se recorta como el Logo de la barra lateral. */
      .splash-logo {
        display: block;
        width: 160px;
        height: 56px;
        overflow: hidden;
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      .splash-logo img {
        display: block;
        height: 100%;
        max-width: none;
      }
      .splash-track {
        position: relative;
        width: 128px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #d9e6f8;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 999px;
        background: #134f9c;
        animation: splash-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.8;
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo,
        .splash-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <output class="splash">
        <span class="splash-logo"><img src="/logo-craisa.png" alt="CRAISA" /></span>
        <div class="splash-track" aria-hidden="true"><div class="splash-bar"></div></div>
        <span class="splash-sr">Cargando</span>
      </output>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
